services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: healthtrack_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-health_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-health_password}
      POSTGRES_DB: ${POSTGRES_DB:-healthtrack_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-health_user} -d ${POSTGRES_DB:-healthtrack_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthtrack_net

  # Aplicação Next.js / Node
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthtrack_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-health_user}:${POSTGRES_PASSWORD:-health_password}@postgres:5432/${POSTGRES_DB:-healthtrack_db}?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-super-secret-jwt-key-change-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - healthtrack_net

volumes:
  postgres_data:
    driver: local

networks:
  healthtrack_net:
    driver: bridge
